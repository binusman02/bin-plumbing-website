name: flowguard_plumbing
description: FlowGuard Plumbing Enterprises — Native Customer & Technician App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  intl: ^0.19.0
  http: ^1.2.2
  http_parser: ^4.0.2
  path_provider: ^2.1.4
  record: ^5.1.2
  audioplayers: ^6.1.0
  mapbox_maps_flutter: ^3.35.2
  sensors_plus: ^7.1.1
  flutter_tts: ^4.2.5

dependency_overrides:
  record_linux: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/flowguard-icon.jpg"
  adaptive_icon_background: "#0B1F3A"
  adaptive_icon_foreground: "assets/images/flowguard-icon.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/images/flowguard-icon.jpg
    - assets/images/ziat-avatar.jpg
    - assets/images/map-pins/
    - assets/images/services/
